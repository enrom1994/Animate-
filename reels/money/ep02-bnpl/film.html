<!doctype html>
<html><head><meta charset="utf-8"><title>Ten Years On, ep. 2: buy now, pay later</title>
<style>
  @font-face { font-family: 'Cap'; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 720px; height: 1280px; }
  canvas { display: block; width: 720px; height: 1280px; }
  #cap { position: absolute; left: 0; right: 0; top: 938px; text-align: center; font: 800 54px/1.1 'Cap', sans-serif; color: #fff; -webkit-text-stroke: 9px #1d1a26; paint-order: stroke fill; letter-spacing: -0.5px; }
  #cap b { color: #ffd23f; }
</style></head>
<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas><div id="cap"></div></div>
<script type="module">
// Ten Years On, episode 2: buy now, pay later. Every frame is window.renderAt(t); t is seconds of audio/vo.wav.
// Shots: the lock screen fills with payment alerts (the hook, a flash-forward) -> through Max's eyes, the $400 sneakers, "or 4 x $100",
// he taps pay later -> Theo at home, saving for three weeks -> the phone, the console, the same way -> the payments list stacks up ->
// payday lands two days late: late fee -> the town at night: 1 in 4 has three or more -> Max outside, "+10%" -> the checkout's
// "0% interest" -> split: Max's three plans / Theo's paid sneakers -> the rule, alone.
import { setupWide, drawWide } from '/money/look2/wide.js';
import { drawStore, STORE } from '/money/look2/store.js';
import { AUDIT, frame, g } from '/money/look2/toon.js';
import { auditFrame } from '/money/look2/check.js';
import { clamp, io, pr, mix, mix3, ss, lmix, money, camOf, push_, pop_, card, stamp, banner, split, blurPan, veil, setupEdit, takeWarp } from '/money/look2/edit.js';
import { STREET, THEO_X, THEO_Z, MAX_X, MAX_Z, MCAR, TCAR, FRAME_THEO, FRAME_MAX, theoEx, maxEx, carsEx, pin, maxShot, theoShot } from '/money/look2/street.js';
import { drawPovPhone, checkout, payments, alert, lock } from '/money/look2/phonepov.js';
import { parcel } from '/money/look2/props/props.js';
import { CAPTIONS, DURATION } from './src/captions.js';
await document.fonts.load("800 54px Cap");
const cv = document.getElementById('c'); setupWide(cv); setupEdit(cv); const capEl = document.getElementById('cap');
// ---- through Max's eyes: at the store counter, phone in hand, the shop out of focus behind it ----
function pov(t, screen, { tap = null, over = null, F0 = 2650, F1 = 2850, t0 = 0, t1 = 4, glass } = {}) {
  const u = ss(pr(t, t0, t1)), sway = [Math.sin(t * 1.7) * .003, Math.sin(t * 2.3 + 1) * .002];
  const eye = [STORE.counterX, 1.62, STORE.maxZ], look = [eye[0] + sway[0], eye[1] - .2 + sway[1], eye[2] + .32];
  const L = Math.hypot(eye[1] - look[1], eye[2] - look[2]), down = Math.atan2(eye[1] - look[1], look[2] - eye[2]);
  const cam = { ...camOf({ look, L, down, F: lmix(F0, F1, u) }), yaw: Math.PI };
  frame(t); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#141b30'; g.fillRect(0, 0, 1080, 1920);
  const n0 = AUDIT.log.length; drawStore(t, cam, { pov: true }); AUDIT.log.length = n0;   // the shop behind, out of focus (not checked: it is a blur)
  blurPan(10);
  drawPovPhone({ at: [540 + Math.sin(t * 1.3) * 6, 850 + Math.sin(t * 1.9) * 5], k: cam.P, rot: Math.sin(t * 1.1) * .02, screen, tap, over, glass });
  AUDIT.subject('phone', [540 - 36 * cam.P / 1000, 850 - 75 * cam.P / 1000, 540 + 36 * cam.P / 1000, 850 + 75 * cam.P / 1000], 200);
}
const ITEMS = { sneakers: { item: 'sneakers', name: 'SNEAKERS', price: '$400.00', each: '$100' }, phone: { item: 'phone', name: 'NEW PHONE', price: '$600.00', each: '$150' }, console: { item: 'console', name: 'GAME CONSOLE', price: '$500.00', each: '$125' } };
const tapAt = (t, t0, d = .3) => clamp(Math.min((t - t0 + d) / d, 1 - (t - t0 - .15) / .35), 0, 1);   // the thumb travels in, presses at t0, lifts away
// Max's front step (his door at x 2.0, the step z -11.5 to -10.2, 0.18 m up): the console, the sneakers stacked on it, the phone beside
const DOORSTEP = [{ x: 1.55, y: .18, z: -10.8, rot: .12, mesh: parcel('console').faces }, { x: 1.6, y: .34, z: -10.75, rot: -.25, mesh: parcel('sneakers').faces }, { x: 2.45, y: .18, z: -10.6, rot: .35, mesh: parcel('phone').faces }];
const PLANS = t => [['sneakers', 100, 1], ['phone', 150, pop_(t, 13.9)], ['console', 125, pop_(t, 15.25)]];
const renderShot = t => {   // t in the first take's seconds (see TW below)
  AUDIT.subjects = 0; STREET.focus = true;
  if (t < 3.8) {   // the hook, a flash-forward: his lock screen fills with payment alerts
    pov(t, () => lock({ n: mix(0, 4, pr(t, .2, 2.6)) }), { glass: '#2b4a63', F0: 2500, F1: 2800, t1: 3.8 });
    card(540, 160, 'PAID LATE, PAST YEAR', 'NEARLY HALF', { col: '#b8302a', w: 640, bigPx: 92, s: pop_(t, .3) }); }
  else if (t < 10.8) {   // the sneakers: $400, or four payments of $100; he taps pay later
    const press = t > 9.8 && t < 10.05 ? 1 : 0, appr = ss(pr(t, 10.0, 10.3));
    pov(t, () => checkout({ ...ITEMS.sneakers, row: pr(t, 6.35, 6.45), press, approved: appr }), { tap: { u: 55, v: 127.5, k: tapAt(t, 9.85) }, t0: 3.8, t1: 10.8 });
    if (t > 6.3 && t < 9.7) card(540, 160, 'THE SAME $400', '4 × $100', { col: '#2f6f73', w: 520, s: pop_(t, 6.4) }); }
  else if (t < 12.6) {   // Theo waits three weeks and saves up
    const st = push_(FRAME_THEO, ss(pr(t, 10.8, 12.6)), 8); theoShot(t, st, { act: { smile: .4 } })();
    const wk = Math.min(3, 1 + Math.floor(3 * pr(t, 11.0, 12.3))), [a, b] = pin(THEO_X, THEO_Z, 2.6);
    card(540, 300, `THEO SAVES · WEEK ${wk}`, money([0, 135, 270, 400][wk]), { col: '#2f6f73', w: 600, s: pop_(t, 10.9) }); }
  else if (t < 15.65) {   // then a phone the same way, then a console
    const it = t < 14.55 ? ITEMS.phone : ITEMS.console, t0 = t < 14.55 ? 13.9 : 15.2;
    pov(t, () => checkout({ ...it, row: 1, press: t > t0 - .05 && t < t0 + .2 ? 1 : 0, approved: ss(pr(t, t0 + .1, t0 + .4)) }), { tap: { u: 55, v: 127.5, k: tapAt(t, t0) }, t0: 12.6, t1: 15.65 }); }
  else if (t < 19.9) {   // now three plans take money every two weeks; payday lands two days after one of them
    pov(t, () => payments({ plans: PLANS(t).map(([i, e]) => [i, e, 1]), payday: pr(t, 18.25, 18.6), late: t > 19.0 ? 1 : 0, total: pr(t, 16.6, 16.9) }), { t0: 15.65, t1: 19.9 });
    card(540, 160, 'EVERY TWO WEEKS', '$375', { col: '#b8302a', w: 520, s: pop_(t, 16.7) * (t < 18.1 ? 1 : 0) });
    if (t > 18.1) card(540, 160, 'DUE MAR 4 · PAID MAR 6', 'TWO DAYS SHORT', { col: '#b8302a', w: 600, bigPx: 80, s: pop_(t, 18.3) }); }
  else if (t < 20.6) {   // late fee
    pov(t, () => payments({ plans: PLANS(t).map(([i, e]) => [i, e, 1]), payday: 1, late: 1, total: 1 }), { over: () => alert({ k: pr(t, 19.9, 20.15) }), t0: 15.65, t1: 20.6 });
    stamp(540, 160, 'LATE FEE', pop_(t, 20.0)); }
  else if (t < 24.2) {   // one in four users has had three or more at once: three boxes on Max's doorstep
    const u = ss(pr(t, 20.6, 24.2)), st = { look: [mix(2.25, 2.05, u), 1.05, -10.8], L: lmix(6.6, 5.4, u), down: .16, F: 2300 };
    drawWide(t, { ...camOf(st), extras: DOORSTEP }, { tilt: false });
    card(540, 250, 'BUY NOW, PAY LATER USERS', '1 IN 4', { col: '#2e1d1c', w: 640, bigPx: 110, s: pop_(t, 20.75) });
    card(540, 520, 'HAVE HAD AT ONCE', '3+ LOANS', { col: '#b8302a', w: 520, bigPx: 96, s: pop_(t, 22.1) }); }
  else if (t < 29.3) {   // one large study: about 10% more spent when the price can be split
    const st = push_(FRAME_MAX, ss(pr(t, 24.2, 29.3)), 7.5); maxShot(t, st, { act: { smile: .5 } })();
    card(540, 250, 'ONE LARGE STUDY', 'SPEND ~10% MORE', { col: '#b8302a', w: 640, bigPx: 84, s: pop_(t, 24.6) });
    banner(540, 470, 'WHEN THE PRICE IS SPLIT', pop_(t, 27.9), { px: 52, w: 640, fill: '#fbf6ea' }); }
  else if (t < 31.35) {   // the plans charge no interest
    pov(t, () => checkout({ ...ITEMS.sneakers, row: 1 }), { t0: 29.3, t1: 31.35, F0: 2850, F1: 3300 });
    stamp(540, 160, '0% INTEREST', pop_(t, 30.4), { col: '#2f6f73' }); }
  else if (t < 34.6) {   // the trap: small payments make it easy to say yes. Max's three plans / Theo's paid sneakers
    split(t, () => { maxShot(t, FRAME_MAX)(); const [a, b] = pin(MCAR[0], MCAR[1], 2.6); card(clamp(a, 300, 780), Math.max(b - 60, 640), 'MAX · 3 PLANS', '$375 / 2 WKS', { col: '#b8302a', w: 460, bigPx: 72, s: pop_(t, 31.5) }); },
      () => { theoShot(t, FRAME_THEO, { act: { smile: .6 } })(); const [a, b] = pin(TCAR[0], TCAR[1], 2.6); card(clamp(a, 300, 780), Math.max(b - 60, 640), 'THEO · SNEAKERS', 'PAID', { col: '#2f6f73', w: 460, bigPx: 80, s: pop_(t, 32.2) }); },
      { reveal: pr(t, 31.35, 31.7) }); }
  else {   // the rule, alone over the street
    split(t, () => maxShot(t, FRAME_MAX)(), () => theoShot(t, FRAME_THEO, { act: { smile: .6 } })());
    const k = ss(pr(t, 34.6, 34.9)); blurPan(10 * k); veil(.6 * k); if (k >= 1) AUDIT.log = AUDIT.log.filter(e => e.k !== 'subject' && e.k !== 'text');
    card(540, 760, 'THE RULE', 'ONE PLAN AT A TIME', { w: 760, bigPx: 72, s: pop_(t, 35.1) });
    banner(540, 1030, 'ONLY FOR WHAT YOU COULD PAY TODAY', pop_(t, 36.6), { px: 44, w: 760, fill: '#ffd23f' }); }
  const c = CAPTIONS.find(([a, , b]) => t >= a && t < b); capEl.innerHTML = c ? c[1] : '';
};
// the voice was re-recorded with a new hook (the hook gate): times in the new take map back to the shots' seconds, word by word
const TW = takeWarp(await (await fetch(new URL('./tools/takewarp.json', location.href))).json());
window.renderAt = t => { renderShot(TW(t)); const c = CAPTIONS.find(([a, , b]) => t >= a && t < b); capEl.innerHTML = c ? c[1] : ''; };
const MOVES = [];
window.audit = t => { AUDIT.on = true; AUDIT.log = []; window.renderAt(t); AUDIT.on = false;
  return auditFrame(AUDIT.log, 1080, 1920, { moving: MOVES.some(([a, b]) => TW(t) >= a && TW(t) <= b), capBox: capEl.innerHTML ? [60, 1395, 1020, 1500] : null }); };
window.DURATION = DURATION; window.done = true; window.renderAt(0);
</script></body></html>
