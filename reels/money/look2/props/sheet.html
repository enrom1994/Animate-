<!doctype html>
<html><head><meta charset="utf-8"><title>Ten Years On: prop sheet</title>
<style>@font-face { font-family: "Cap"; src: url("/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; } html,body{margin:0;background:#efe6d2} canvas{display:block}</style></head>
<body><canvas id="c" width="1800" height="5800"></canvas>
<script type="module">
// The prop sheet: every prop from three camera angles (front-on, three-quarter, high oblique), each beside a 1.75 m person
// drawn at the same scale, with its real size written under it. If a prop looks wrong at any angle, it is wrong in the films.
import { init, frame, shape, stroke, dot, text, ell } from '../toon.js';
import { CAM, view, proj, draw } from './mesh.js';
import { ALL } from './props.js';
await document.fonts.load("800 30px Cap");
const cv = document.getElementById('c'), g = init(cv); frame(0);
g.fillStyle = '#efe6d2'; g.fillRect(0, 0, 1800, 5800);
const VIEWS = [['eye level', 0, .1], ['three-quarter', -.6, .42], ['high oblique', -.45, .95]];
// a 1.75 m person for scale: a flat card facing the camera, standing at a point on the ground
function person(x, z) { const [fx, fy] = proj(x, 0, z), [hx, hy] = proj(x, 1.75, z), H = fy - hy;
  if (H < 4) return; const r = H * .14, cx = fx, top = fy - H;
  shape([[cx - H * .1, fy - H * .5], [cx + H * .1, fy - H * .5], [cx + H * .09, fy - H * .74], [cx - H * .09, fy - H * .74]], { fill: '#7d8086', lw: 3 });
  stroke([[cx - H * .05, fy - H * .5], [cx - H * .06, fy]], 3); stroke([[cx + H * .05, fy - H * .5], [cx + H * .06, fy]], 3);
  shape(ell(cx, top + r, r, r, 20), { fill: '#e9b98f', lw: 3 }); }
const ROWH = 330, TOP = 120;
text('PROP SHEET  ·  every prop at three angles, beside a 1.75 m person', 900, 60, { font: '800 34px Cap', fill: '#2e1d1c' });
VIEWS.forEach(([n], i) => text(n.toUpperCase(), 300 + i * 600, 100, { font: '800 24px Cap', fill: '#6b5a4a' }));
ALL.forEach((mk, r) => { const M = mk(), [lx, ly, lz] = M.size, span = Math.max(lx, lz, 1.4) + 1.3, P = Math.min(420 / span, 200 / Math.max(ly, 1.75));
  VIEWS.forEach(([n, yaw, pitch], i) => { const ox = 300 + i * 600, oy = TOP + r * ROWH + 250;
    view({ yaw, pitch, P, ox, oy, cx: .45, cy: 0, cz: 0 });
    shape([proj(-span / 2 + .4, 0, -lz), proj(span / 2 + .4, 0, -lz), proj(span / 2 + .4, 0, lz + .6), proj(-span / 2 + .4, 0, lz + .6)].map(p => [p[0], p[1]]), { fill: 'rgba(46,29,28,.07)', lw: 2, line: 'rgba(46,29,28,.25)', boil: 0 });   // a floor patch
    const px = -Math.max(lx, .6) / 2 - .55, pz = lz / 2 + .35, front = proj(px, 0, pz)[2] < proj(0, ly / 2, 0)[2];   // the person stands front-left; drawn in front of the prop only when nearer
    if (!front) person(px, pz); draw(M.faces, [0, 0, 0], 0, { lw: 3 }); M.ink?.(); if (front) person(px, pz); });
  text(`${M.name}  ·  ${M.size.map(v => v < 1 ? (v * 100).toFixed(0) + ' cm' : v.toFixed(2) + ' m').join(' × ')}`, 30, TOP + r * ROWH + 18, { font: '800 22px Cap', fill: '#2e1d1c', align: 'left' }); stroke([[20, TOP + r * ROWH], [1780, TOP + r * ROWH]], 2, { line: 'rgba(46,29,28,.2)' }); });
// paper props again, close: the print on the sheet seen at the three angles
ALL.map(mk => mk()).filter(M => M.ink).forEach((M, r) => { const y0 = TOP + ALL.length * ROWH + r * ROWH;
  text(`${M.name}  ·  close-up of the print`, 30, y0 + 18, { font: '800 22px Cap', fill: '#2e1d1c', align: 'left' });
  VIEWS.forEach(([n, yaw, pitch], i) => { view({ yaw, pitch: Math.max(pitch, .55), P: 900, ox: 300 + i * 600, oy: y0 + 170, cx: 0, cy: 0, cz: 0 }); draw(M.faces, [0, 0, 0], 0, { lw: 2 }); M.ink(); }); });
window.done = true;
</script></body></html>
