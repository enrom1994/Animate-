<!doctype html>
<html><head><meta charset="utf-8"><title>Ten Years On: zoom test</title>
<style>@font-face { font-family: "Cap"; src: url("/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2") format("woff2"); font-weight: 800; } html,body{margin:0;background:#000} canvas{display:block;width:720px;height:1280px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// The reference's opening move, in our look: close on the shopfront, a huge pull out over the neighbourhood, then a whip into the counter.
import { setupWide, drawWide } from './wide.js';
import { setupCounter, drawCounter } from './counter.js';
await document.fonts.load("800 54px Cap");
const cv = document.getElementById('c'), g = cv.getContext('2d'); setupWide(cv); setupCounter(cv);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2, pr = (t, a, b) => clamp((t - a) / (b - a));
const P0 = 72, P1 = 12.5, cut = 3.55;
window.renderAt = t => {
  if (t < cut) { const u = io(pr(t, 1.2, 3.3)), P = P0 * Math.pow(P1 / P0, u);   // the zoom runs on a log scale, so it feels even
    const pitch = 1.1 + (.78 - 1.1) * io(pr(t, 1.2, 2.6)), hc = 2.3 * (1 - u) + 0 * u;   // front-on at the shopfront, tilting up to the high view
    const cz = (27 - hc * Math.tan(pitch)) * (1 - u) + 14 * u, cx = 3 + .3 * Math.sin(t) * (1 - u) + 2 * u;
    drawWide(t, { pitch, P: P * (1 + .025 * t * (1 - u)), cx, cz, near: 44 + 160 * u * u }, { tilt: u > .25 });
    const w = pr(t, cut - .14, cut); if (w > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.filter = `blur(${w * 30}px)`; g.drawImage(cv, -w * 300, 0); g.filter = 'none'; } }
  else { drawCounter(t); const w = 1 - pr(t, cut, cut + .14); if (w > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.filter = `blur(${w * 30}px)`; g.drawImage(cv, w * 300, 0); g.filter = 'none'; } }
};
window.DURATION = 5; window.done = true; window.renderAt(0);
</script></body></html>
