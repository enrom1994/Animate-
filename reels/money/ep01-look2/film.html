<!doctype html>
<html><head><meta charset="utf-8"><title>Ten Years On, ep. 1: the car payment (look 2)</title>
<style>
  @font-face { font-family: 'Cap'; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 720px; height: 1280px; }
  canvas { display: block; width: 720px; height: 1280px; }
  #cap { position: absolute; left: 0; right: 0; top: 938px; text-align: center; font: 800 54px/1.1 'Cap', sans-serif; color: #fff; -webkit-text-stroke: 9px #1d1a26; paint-order: stroke fill; letter-spacing: -0.5px; }
  #cap b { color: #ffd23f; }
</style></head>
<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas><div id="cap"></div></div>
<script type="module">
// Ten Years On, episode 1, in the code-drawn town. Every frame is window.renderAt(t); t is seconds of audio/vo.wav.
// Shots: Max at the counter -> pull out through the window, over the town, and down onto Theo at his house -> whip pan to Max's
// new coupe next door -> split screen (Max new / Theo used) -> $205 -> Theo invests -> whip pan: Max's car loses half ->
// six years later, split, both paid off -> Theo's $17,660 -> rise over the town, ten years on, $23,621 -> same paycheck.
import { setupWide, drawWide, town, HOMES } from '/money/look2/wide.js';
import { drawStore, eyeOf, insideStore, STORE } from '/money/look2/store.js';
import { AUDIT, S as INKS, frame, g, push, pop, translate, scale, shape, stroke, rr, text } from '/money/look2/toon.js';
import { auditFrame } from '/money/look2/check.js';
import { maxStanding, theoStanding, THEO } from '/money/look2/cast.js';
import { UNIT, ORIGIN_H } from '/money/look2/max.js';
import { car as hatch, coupe } from '/money/look2/props/props.js';
import { CAPTIONS, DURATION } from '/money/ep01-car/src/captions.js';
await document.fonts.load("800 54px Cap");
const cv = document.getElementById('c'); setupWide(cv); const capEl = document.getElementById('cap');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2, pr = (t, a, b) => clamp((t - a) / (b - a)),
  mix = (a, b, u) => a + (b - a) * u, mix3 = (a, b, u) => a.map((v, i) => mix(v, b[i], u)), ss = u => u * u * (3 - 2 * u), lmix = (a, b, u) => a * Math.pow(b / a, u), back = u => 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
// ---- the camera: a look point, its distance L, how much it looks down, the lens F (px per metre at 1 m) ----
const camOf = ({ look, L, down, F }) => ({ pitch: Math.PI / 2 - down, P: F / L, dist: L, cx: look[0], cy: look[1], cz: look[2] });
const MAXC = [STORE.counterX - .15, 1.35, STORE.maxZ], MID = [14, 0, -2];
const THEO_X = 21.3, THEO_Z = -6.9, TCAR = [24.0, -8.8], MAX_X = 8.0, MAX_Z = -6.9, MCAR = [9.9, -9.0];   // each man stands in front of his car
const FRAME_THEO = { look: [22.5, 1.1, -7.2], L: 9.5, down: .1, F: 2300 }, FRAME_MAX = { look: [9.2, 1.1, -7.2], L: 9.5, down: .1, F: 2300 };
const CLOSE_THEO = { look: [THEO_X + .3, 1.2, THEO_Z], L: 5, down: .1, F: 2300 };
// ---- the people and cars, as extras the town draws in depth ----
let FOCUS = true;   // is the camera close on the people? (in the wide town shots they are scenery, not the subject)
const person = (draw, name) => (sx, sy, kpx) => { const k = kpx * UNIT, lw0 = INKS.lwScale; INKS.lwScale = lw0 * clamp(k, .3, 1); push(); translate(sx, sy); scale(k); draw(); pop(); INKS.lwScale = lw0;
  if (FOCUS) AUDIT.subject(name, [sx - 200 * k, sy - 670 * k, sx + 200 * k, sy - 270 * k], 60); };
const COUPE = coupe('#c8302a').faces, COUPE_OLD = coupe('#8f3a33').faces, HATCH = hatch('#7d8f86').faces;
const theoEx = (t, act = {}) => ({ x: THEO_X, z: THEO_Z, h: ORIGIN_H, fn: person(() => theoStanding(t, THEO.C, act), 'Theo') });
const maxEx = (t, act = {}) => ({ x: MAX_X, z: MAX_Z, h: ORIGIN_H, fn: person(() => maxStanding(t, { outfit: 'flash', act }), 'Max') });
const carsEx = (old = false) => [{ x: MCAR[0], z: MCAR[1], dir: 'x', car: old ? COUPE_OLD : COUPE }, { x: TCAR[0], z: TCAR[1], dir: 'x', car: HATCH }];
// ---- story cards: a rounded card with a small heading and a big figure, pinned to a point on screen ----
const textW = (str, font) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.font = font; const w = g.measureText(str).width; g.restore(); return w; };
const fitW = (w, ...items) => Math.max(w, ...items.map(([str, font, px]) => textW(str, font) + 2 * Math.max(30, px * .45)));   // a box never narrower than its text plus a margin
function card(x, y, head, big, { col = '#2e1d1c', w = 520, bigPx = 96, tilt = 0, s = 1 } = {}) {
  if (s <= .01) return; w = fitW(w, [head, '800 40px Cap', 40], [big, `800 ${bigPx}px Cap`, bigPx]); push(); translate(x, y); scale(s); if (tilt) { /* a stamp leans */ }
  shape(rr(-w / 2, -95, w, 190, 28), { fill: '#fbf6ea', lw: 8 });
  text(head, 0, -46, { font: '800 40px Cap', fill: '#6b5a4a' }); text(big, 0, 26, { font: `800 ${bigPx}px Cap`, fill: col }); pop(); }
function stamp(x, y, word, s = 1) { if (s <= .01) return; push(); translate(x, y); scale(s); shape(rr(-230, -62, 460, 124, 16), { fill: '#fbf6ea', lw: 10, line: '#b8302a' }); text(word, 0, 4, { font: '800 76px Cap', fill: '#b8302a' }); pop(); }
const pin = (x, z, h) => town.pj(x, z, h);
const pop_ = (t, t0, d = .35) => back(clamp((t - t0) / d)) * (t >= t0 ? 1 : 0);   // a card springs in
// ---- one half of a split screen: render the shot full frame, keep its middle band ----
const half = document.createElement('canvas'); half.width = 1080; half.height = 1920; const hg = half.getContext('2d');
function renderHalf(drawFull, top, layer) {
  const n0 = AUDIT.log.length; drawFull();
  for (const e of AUDIT.log.slice(n0)) { e.bb = [e.bb[0], e.bb[1] + (top ? -480 : 480), e.bb[2], e.bb[3] + (top ? -480 : 480)]; e.clip = top ? [0, 0, 1080, 960] : [0, 960, 1080, 1920]; e.layer = layer;
    if (e.bb[3] < e.clip[1] || e.bb[1] > e.clip[3]) e.drop = true; }
  AUDIT.log = AUDIT.log.filter(e => !e.drop);
  hg.drawImage(cv, 0, 480, 1080, 960, 0, top ? 0 : 960, 1080, 960);
}
function split(t, drawTop, drawBottom, { reveal = 1 } = {}) {   // reveal: how far the bottom half has wiped up
  renderHalf(drawTop, true, 'top'); renderHalf(drawBottom, false, 'bottom');
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(half, 0, 0, 1080, 960, 0, 0, 1080, 960);
  const y = mix(1920, 960, ss(reveal)); g.drawImage(half, 0, 960, 1080, 960, 0, y, 1080, 960);
  g.fillStyle = '#1d1a26'; g.fillRect(0, y - 6, 1080, 12);
}
function expandBottom(u, drawTop, drawFull) {   // the bottom half grows to fill the frame, pushing the top half up and out
  renderHalf(drawTop, true, 'top'); const n0 = AUDIT.log.length; drawFull(); const edge = mix(960, 0, ss(u));
  for (const e of AUDIT.log.slice(n0)) e.layer = 'full';
  for (const e of AUDIT.log) if (e.layer === 'top') { e.bb = [e.bb[0], e.bb[1] - (960 - edge), e.bb[2], e.bb[3] - (960 - edge)]; e.clip = [0, 0, 1080, edge]; }
  if (edge > 1) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(half, 0, 960 - edge, 1080, edge, 0, 0, 1080, edge); g.fillStyle = '#1d1a26'; g.fillRect(0, edge - 6, 1080, 12); }
}
function blurPan(px) { if (px < .5) return; hg.drawImage(cv, 0, 0); g.setTransform(1, 0, 0, 1, 0, 0); g.filter = `blur(${px}px)`; g.drawImage(half, 0, 0); g.filter = 'none'; }
// ---- the shots ----
const ACT0 = t => { const up = io(pr(t, 2.6, 2.95)), sigh = Math.sin(Math.PI * pr(t, 3.1, 3.8));
  return { look: [mix(.15, 0, up), mix(.6, -.05, up)], lid: mix(.55, .32, up) + .1 * sigh, tilt: mix(-.05, .03, up), sigh, blink: t > 3.0 && t < 3.1, bling: true, shades: true, holdBill: true }; };
function storeToTheo(t) {   // 0 - 7.45: one move, inside the store to Theo's front yard
  const act = ACT0(t);
  let st;
  if (t < 5.8) { const v = io(pr(t, 3.9, 5.8)), L = v > 0 ? lmix(2.3, 70, v) : mix(2.45, 2.3, ss(pr(t, 0, 3.9)));
    const down = v < .08 ? mix(.30, .14, ss(v / .08)) : mix(.14, .75, ss(pr(v, .25, 1)));
    st = { look: mix3(MAXC, MID, ss(pr(v, .28, 1))), L, down, F: lmix(2070, 2600, v) }; }
  else { const u = io(pr(t, 5.8, 7.45)); st = { look: mix3(MID, CLOSE_THEO.look, ss(u)), L: lmix(70, CLOSE_THEO.L, u), down: mix(.75, CLOSE_THEO.down, u), F: lmix(2600, CLOSE_THEO.F, u) }; }
  const cam = { ...camOf(st), act, focus: t < 4.6 ? 'max' : null }; FOCUS = st.L < 15;
  if (insideStore(eyeOf(cam))) { frame(t); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#141b30'; g.fillRect(0, 0, 1080, 1920); drawStore(t, cam, act); return; }
  drawWide(t, { ...cam, extras: [theoEx(t, { look: [0, 0] })] }, { tilt: st.L > 30 });
  const k = pr(t, 4.9, 5.2) * (1 - pr(t, 6.3, 6.6));   // who lives where, as the camera hangs over the town
  if (k > 0) { const [a, b] = pin(3, 27, 9), [c, d] = pin(22, -16, 9); card(c, d, 'NEXT DOOR TO MAX', 'THEO', { w: 460, bigPx: 80, s: k * .8 }); }
}
const maxShot = (t, st, { old = false, act = {} } = {}) => () => drawWide(t, { ...camOf(st), extras: [maxEx(t, act), ...carsEx(old)] }, { tilt: false });
const theoShot = (t, st, { old = false, act = {} } = {}) => () => drawWide(t, { ...camOf(st), extras: [theoEx(t, act), ...carsEx(old)] }, { tilt: false });
const push_ = (st, u, L1) => ({ ...st, L: lmix(st.L, L1, u) });
window.renderAt = t => {
  AUDIT.subjects = 0; FOCUS = true;
  if (t < 7.45) storeToTheo(t);
  else if (t < 8.5) {   // whip pan along the street from Theo's yard to Max next door: his new coupe
    const u = io(pr(t, 7.45, 7.8)), st = { look: mix3(CLOSE_THEO.look, FRAME_MAX.look, u), L: lmix(CLOSE_THEO.L, FRAME_MAX.L, u), down: .12, F: 2300 };
    drawWide(t, { ...camOf(st), extras: [theoEx(t), maxEx(t), ...carsEx()] }, { tilt: false }); blurPan(Math.sin(Math.PI * u) * 22);
    const [a, b] = pin(MCAR[0], MCAR[1], 2.4); card(a, b - 40, 'NEW', '$787/mo', { col: '#b8302a', s: .9 * pop_(t, 7.75) }); }
  else if (t < 13.85) {   // split: Max new on top, Theo used below; then the $205 between them
    split(t, () => { maxShot(t, FRAME_MAX)(); const [a, b] = pin(MCAR[0], MCAR[1], 2.4); card(a, b - 40, 'NEW', '$787/mo', { col: '#b8302a', s: .9 }); },
      () => { theoShot(t, FRAME_THEO, { act: { look: [-.3, 0] } })(); const [a, b] = pin(TCAR[0], TCAR[1], 2.4); card(a, b - 40, 'USED', '$580/mo', { col: '#2f6f73', s: .9 * pop_(t, 9.0) }); },
      { reveal: pr(t, 8.5, 8.85) });
    const k = pop_(t, 11.6, .4); if (k > 0) { push(); translate(360, 960); scale(k); const bw = fitW(600, ['$205 a month', '800 84px Cap', 84]); shape(rr(-bw / 2, -92, bw, 184, 30), { fill: '#ffd23f', lw: 10 }); text('$205 a month', 0, 4, { font: '800 84px Cap', fill: '#2e1d1c' }); pop(); } }
  else if (t < 17.45) {   // Theo puts the difference away, month after month
    const u = pr(t, 13.85, 14.25), st = push_(FRAME_THEO, ss(pr(t, 14.0, 17.4)), 9);
    if (u < 1) expandBottom(u, maxShot(t, FRAME_MAX), theoShot(t, st)); else theoShot(t, st, { act: { look: [.2, -.1] } })();
    const months = Math.min(70, Math.floor(1 + 69 * ss(pr(t, 14.8, 17.2)))), [a, b] = pin(THEO_X + 1.6, THEO_Z, 2.9);
    card(a + 60, b - 20, `MONTH ${months}`, '+$205', { col: '#2f6f73', s: .9 * pop_(t, 14.6) });
    card(540, 260, 'INVESTED SO FAR', money(205 * months), { col: '#2e1d1c', w: 600, s: pop_(t, 14.85) }); }
  else if (t < 21.65) {   // meanwhile: Max's car loses about half its value
    const u = io(pr(t, 17.45, 17.8)), st0 = push_(FRAME_THEO, 1, 9), st = { look: mix3(st0.look, FRAME_MAX.look, u), L: lmix(st0.L, FRAME_MAX.L * .8, u), down: .12, F: 2300 };
    const old = t > 20.4; drawWide(t, { ...camOf(push_(st, ss(pr(t, 17.8, 21.6)), 9.5)), extras: [maxEx(t, { lid: .5 }), ...carsEx(old)] }, { tilt: false }); blurPan(Math.sin(Math.PI * u) * 22);
    const yr = Math.floor(5 * ss(pr(t, 18.6, 21.0))), [a, b] = pin(MCAR[0], MCAR[1], 2.5);
    card(a, b - 40, `CAR VALUE · YEAR ${yr}`, money(50000 - 5000 * yr), { col: '#b8302a', w: 600, s: pop_(t, 18.0) }); }
  else if (t < 25.1) {   // six years later: both loans done
    split(t, () => { maxShot(t, FRAME_MAX, { old: true })(); const [a, b] = pin(MCAR[0], MCAR[1], 2.6); stamp(a, b - 30, 'PAID OFF', pop_(t, 22.6)); },
      () => { theoShot(t, FRAME_THEO)(); const [a, b] = pin(TCAR[0], TCAR[1], 2.6); stamp(a, b - 30, 'PAID OFF', pop_(t, 23.6)); });
    const k = (1 - pr(t, 22.4, 22.7)); if (k > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = k; g.fillStyle = '#141b30'; g.fillRect(0, 760, 1080, 400); g.globalAlpha = 1; push(); text('6 YEARS LATER', 540, 960, { font: '800 104px Cap', fill: '#ffd23f' }); pop(); } }
  else if (t < 27.9) {   // but Theo also has about $17,000
    const u = pr(t, 25.1, 25.5), st = push_(FRAME_THEO, ss(pr(t, 25.3, 27.9)), 10);
    if (u < 1) expandBottom(u, maxShot(t, FRAME_MAX, { old: true }), theoShot(t, st)); else theoShot(t, st, { act: { smile: .6 } })();
    card(540, 300, 'THEO ALSO HAS', money(17660 * ss(pr(t, 25.4, 26.8))), { col: '#2f6f73', w: 620, bigPx: 120, s: pop_(t, 25.3) }); }
  else {   // ten years on: rise over the town, the money keeps growing; same paycheck
    const u = io(pr(t, 27.9, 33.0)), st = { look: mix3(push_(FRAME_THEO, 1, 10).look, [14, 0, -10], ss(u)), L: lmix(10, 230, u), down: mix(.12, .8, ss(u)), F: lmix(2300, 2900, u) };
    FOCUS = st.L < 15; drawWide(t, { ...camOf(st), extras: [theoEx(t, { smile: .6 }), maxEx(t), ...carsEx(true)] }, { tilt: u > .5 });
    const [a, b] = pin(22, -16, 9), [c, d] = pin(6, -16, 11), k = ss(pr(t, 28.3, 28.7));
    card(clamp(a, 330, 750), Math.max(b, 330), t < 32.6 ? 'TEN YEARS ON · 7% A YEAR' : 'THEO', money(t < 28.6 ? 17660 : mix(17660, 23621, ss(pr(t, 28.6, 31.4)))), { col: '#2f6f73', w: 640, bigPx: 110, s: k });
    if (t > 32.7) { card(clamp(c, 330, 750), Math.max(d, 330) + 250, 'MAX', 'NEW CAR', { col: '#b8302a', w: 460, bigPx: 80, s: pop_(t, 32.8) }); card(540, 1700, 'SAME PAYCHECK', 'ONE PAYMENT APART', { w: 760, bigPx: 64, s: pop_(t, 34.2) }); } }
  const c = CAPTIONS.find(([a, , b]) => t >= a && t < b); capEl.innerHTML = c ? c[1] : '';
};
const MOVES = [[3.9, 7.8], [17.45, 17.8], [27.9, 33.0]];   // the camera is sweeping: things pass the frame edge and under the caption
window.audit = t => { AUDIT.on = true; AUDIT.log = []; window.renderAt(t); AUDIT.on = false;
  return auditFrame(AUDIT.log, 1080, 1920, { moving: MOVES.some(([a, b]) => t >= a && t <= b), capBox: capEl.innerHTML ? [60, 1395, 1020, 1500] : null }); };
window.DURATION = DURATION; window.done = true; window.renderAt(0);
</script></body></html>
